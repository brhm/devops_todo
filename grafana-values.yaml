deploymentStrategy:
  type: Recreate

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 384Mi

persistence:
  enabled: false

service:
  type: ClusterIP

adminUser: admin

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus-server.monitoring.svc.cluster.local
        isDefault: true
        editable: true

      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        editable: true