
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deployer
  namespace: devops-todo
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - backend
      - frontend
    verbs:
      - get
      - patch
      - update

  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs:
      - list
      - watch

  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs:
      - get
      - list
      - watch

  - apiGroups: [""]
    resources: ["pods"]
    verbs:
      - get
      - list
      - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer-binding
  namespace: devops-todo
subjects:
  - kind: Group
    name: devops-todo-deployers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-actions-deployer
  apiGroup: rbac.authorization.k8s.io
